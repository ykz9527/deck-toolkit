<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 312" width="1180" height="312" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;}
      .mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
    </style>
  </defs>

  <!-- ============ A · COVER (dark) ============ -->
  <rect x="20" y="36" width="360" height="228" rx="3" fill="#060606" stroke="#3a3a3a"/>
  <text x="42" y="72" class="mono" fill="#8d8d8d" font-size="10" letter-spacing="2">THE PROJECT</text>
  <rect x="42" y="80" width="24" height="2" fill="#c9952a"/>
  <text x="42" y="146" class="serif" fill="#e8e2d6" font-size="30" font-weight="600" letter-spacing="-1">What this</text>
  <text x="42" y="180" class="serif" fill="#e8e2d6" font-size="30" font-weight="600" letter-spacing="-1">project is.</text>
  <line x1="42" y1="208" x2="358" y2="208" stroke="#3a3a3a"/>
  <g class="mono">
    <text x="42" y="226" fill="#8d8d8d" font-size="7.5" letter-spacing="1.2">AUDIENCE</text>
    <text x="150" y="226" fill="#8d8d8d" font-size="7.5" letter-spacing="1.2">FORMAT</text>
    <text x="258" y="226" fill="#8d8d8d" font-size="7.5" letter-spacing="1.2">THEME</text>
  </g>
  <g class="serif" fill="#e8e2d6" font-size="12">
    <text x="42" y="244">leaders + new</text>
    <text x="150" y="244">single file</text>
    <text x="258" y="244">dark &#183; warm</text>
  </g>
  <text x="358" y="256" text-anchor="end" class="mono" fill="#5c5c5c" font-size="9" letter-spacing="1.5">01</text>

  <!-- ============ B · LIVE DEMO (dark screen) ============ -->
  <rect x="410" y="36" width="360" height="228" rx="3" fill="#060606" stroke="#3a3a3a"/>
  <text x="432" y="66" class="mono" fill="#c9952a" font-size="10" font-weight="700" letter-spacing="2">LIVE DEMO</text>
  <text x="432" y="98" class="serif" fill="#e8e2d6" font-size="22" font-weight="600">See it run.</text>
  <!-- product screen -->
  <rect x="432" y="112" width="316" height="118" rx="2" fill="#0d0d0d" stroke="#3a3a3a"/>
  <!-- story column -->
  <rect x="446" y="128" width="82" height="5" rx="2" fill="#c9952a"/>
  <rect x="446" y="142" width="66" height="5" rx="2" fill="#5c5c5c"/>
  <rect x="446" y="156" width="74" height="5" rx="2" fill="#5c5c5c"/>
  <rect x="446" y="170" width="58" height="5" rx="2" fill="#5c5c5c"/>
  <line x1="560" y1="124" x2="560" y2="218" stroke="#202020"/>
  <!-- staged graph -->
  <line x1="612" y1="167" x2="648" y2="167" stroke="#c9952a" stroke-width="1.5"/>
  <line x1="680" y1="167" x2="716" y2="167" stroke="#3a3a3a" stroke-width="1.5"/>
  <rect x="582" y="158" width="30" height="18" rx="2" fill="#c9952a"/>
  <rect x="648" y="158" width="30" height="18" rx="2" fill="#c9952a"/>
  <rect x="716" y="158" width="30" height="18" rx="2" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="597" y="200" text-anchor="middle" class="mono" fill="#8d8d8d" font-size="8">stage 1</text>
  <text x="663" y="200" text-anchor="middle" class="mono" fill="#8d8d8d" font-size="8">stage 2</text>
  <!-- controls -->
  <rect x="432" y="240" width="30" height="16" rx="2" fill="#c9952a"/>
  <text x="447" y="252" text-anchor="middle" fill="#15130f" font-size="9">&#9654;</text>
  <rect x="468" y="240" width="30" height="16" rx="2" fill="none" stroke="#3a3a3a"/>
  <text x="483" y="252" text-anchor="middle" fill="#8d8d8d" font-size="10">&#8250;</text>
  <rect x="504" y="240" width="30" height="16" rx="2" fill="none" stroke="#3a3a3a"/>
  <text x="519" y="252" text-anchor="middle" fill="#8d8d8d" font-size="9">&#8635;</text>
  <text x="748" y="256" text-anchor="end" class="mono" fill="#5c5c5c" font-size="9" letter-spacing="1.5">07</text>

  <!-- ============ C · VALUE (warm) ============ -->
  <rect x="800" y="36" width="360" height="228" rx="3" fill="#efe9dd" stroke="#cfc7b4"/>
  <text x="822" y="72" class="mono" fill="#7c7568" font-size="10" font-weight="700" letter-spacing="2">WHY IT'S BETTER</text>
  <rect x="822" y="80" width="24" height="2" fill="#c9952a"/>
  <text x="822" y="122" class="serif" fill="#17140e" font-size="24" font-weight="600" letter-spacing="-1">Derived,</text>
  <text x="822" y="150" class="serif" fill="#17140e" font-size="24" font-weight="600" letter-spacing="-1">not hand-written.</text>
  <!-- fan-out evidence: one source -> three derived -->
  <rect x="828" y="182" width="40" height="40" rx="2" fill="none" stroke="#17140e" stroke-width="1.6"/>
  <text x="848" y="236" text-anchor="middle" class="mono" fill="#7c7568" font-size="8">schema</text>
  <line x1="868" y1="202" x2="1060" y2="180" stroke="#c9952a" stroke-width="1.4"/>
  <line x1="868" y1="202" x2="1060" y2="202" stroke="#c9952a" stroke-width="1.4"/>
  <line x1="868" y1="202" x2="1060" y2="224" stroke="#c9952a" stroke-width="1.4"/>
  <rect x="1060" y="170" width="30" height="20" rx="2" fill="#c9952a"/>
  <rect x="1060" y="192" width="30" height="20" rx="2" fill="#c9952a"/>
  <rect x="1060" y="214" width="30" height="20" rx="2" fill="none" stroke="#17140e" stroke-width="1.4"/>
  <text x="1138" y="256" text-anchor="end" class="mono" fill="#a49d8f" font-size="9" letter-spacing="1.5">12</text>

  <!-- ============ captions ============ -->
  <g text-anchor="middle" class="mono" fill="#8d8d8d" font-size="11">
    <text x="200" y="292">Cover &#183; type-led, dark</text>
    <text x="590" y="292">Live demo &#183; a real workflow, staged</text>
    <text x="980" y="292">Value &#183; warm theme, one assertion</text>
  </g>
</svg>
