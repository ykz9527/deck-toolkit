<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 260" width="1240" height="260" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect x="1" y="1" width="1238" height="258" rx="3" fill="#060606" stroke="#3a3a3a"/>
  <!-- label -->
  <text x="40" y="46" fill="#8d8d8d" font-size="11" font-weight="700" letter-spacing="2.2">PROJECT-SHOWCASE-DECK &#183; HOW IT WORKS</text>
  <rect x="40" y="56" width="30" height="2" fill="#c9952a"/>
  <!-- timeline rule -->
  <line x1="120" y1="92" x2="1120" y2="92" stroke="#3a3a3a" stroke-width="1"/>
  <!-- steps -->
  <g text-anchor="middle">
    <!-- 1 -->
    <circle cx="120" cy="92" r="5" fill="#c9952a"/>
    <text x="120" y="140" fill="#c9952a" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="600">1</text>
    <text x="120" y="172" fill="#e8e2d6" font-size="15" font-weight="700">Extract soul</text>
    <text x="120" y="194" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">read the repo's</text>
    <text x="120" y="211" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">own docs first</text>
    <!-- 2 -->
    <circle cx="320" cy="92" r="5" fill="#c9952a"/>
    <text x="320" y="140" fill="#c9952a" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="600">2</text>
    <text x="320" y="172" fill="#e8e2d6" font-size="15" font-weight="700">Design mainline</text>
    <text x="320" y="194" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">one through-line</text>
    <text x="320" y="211" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">they can repeat</text>
    <!-- 3 -->
    <circle cx="520" cy="92" r="5" fill="#c9952a"/>
    <text x="520" y="140" fill="#c9952a" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="600">3</text>
    <text x="520" y="172" fill="#e8e2d6" font-size="15" font-weight="700">Fill template</text>
    <text x="520" y="194" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">one assertion</text>
    <text x="520" y="211" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">per slide</text>
    <!-- 4 -->
    <circle cx="720" cy="92" r="5" fill="#c9952a"/>
    <text x="720" y="140" fill="#c9952a" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="600">4</text>
    <text x="720" y="172" fill="#e8e2d6" font-size="15" font-weight="700">Build interactions</text>
    <text x="720" y="194" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">2&#8211;3, each argues</text>
    <text x="720" y="211" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">a principle</text>
    <!-- 5 -->
    <circle cx="920" cy="92" r="5" fill="#c9952a"/>
    <text x="920" y="140" fill="#c9952a" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="600">5</text>
    <text x="920" y="172" fill="#e8e2d6" font-size="15" font-weight="700">Static diagrams</text>
    <text x="920" y="194" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">via drawio,</text>
    <text x="920" y="211" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">to the palette</text>
    <!-- 6 -->
    <circle cx="1120" cy="92" r="5" fill="#c9952a"/>
    <text x="1120" y="140" fill="#c9952a" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="600">6</text>
    <text x="1120" y="172" fill="#e8e2d6" font-size="15" font-weight="700">Verify &amp; serve</text>
    <text x="1120" y="194" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">single-file,</text>
    <text x="1120" y="211" fill="#8f8f8f" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">0.0.0.0 preview</text>
  </g>
</svg>
